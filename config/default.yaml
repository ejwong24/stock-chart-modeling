project_root: /home/ubuntu/projects/stock_chart_modeling

universe:
  start_date: "2016-03-28"
  end_date: "2026-04-21"
  top_n_active: 3000
  min_history_days: 252
  delisted_seed_path: config/delisted_seed.txt
  benchmark_ticker: SPY

prefilter:
  ma_window: 250
  ma_extension: 1.5
  enabled: true

labels:
  horizons: [5, 10, 15, 20, 30, 40]
  thresholds: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30]
  warmup_days: 252
  anchor_weekly: true

render:
  lookback_days: 252
  image_size: 224
  log_y_min: 0.1
  log_y_max: 11.0
  line_width: 2

embed:
  model: dinov2_vits14
  batch_size: 16
  num_workers: 2
  emb_dim: 384

splits:
  test_years: [2019, 2020, 2021, 2022, 2023, 2024]
  test_year_lockbox: 2025
  embargo_horizon_multiplier: 1
  min_train_examples: 1000

lockbox:
  audit_path: reports/lockbox.audit.jsonl
  registry_path: reports/lockbox.registry.json
  trial_registry_path: configs/trial_registry.jsonl

models:
  pca_dim: 64
  logreg:
    C: 1.0
    class_weight: balanced
    solver: lbfgs
    max_iter: 1000
  lgbm:
    n_estimators: 400
    learning_rate: 0.05
    num_leaves: 63
    min_child_samples: 200
    reg_alpha: 0.1
    reg_lambda: 0.1

simulator:
  start_equity: 100000.0
  max_position_pct: 0.04
  max_new_per_week: 5
  max_adv_pct: 0.005
  min_adv_usd: 5_000_000
  slippage_bps_each_side: 10
  commission_per_share: 0.005
  no_duplicate_ticker: true

random_baseline:
  n_seeds: 1000

stats:
  bootstrap_n: 10000
  bootstrap_block_size_horizon_multiplier: 1
  n_trials_for_dsr: 216

seeds:
  numpy: 42
  torch: 42
  sklearn_random_state: 42
  lightgbm_random_state: 42
  random_baseline_base_seed: 1000
